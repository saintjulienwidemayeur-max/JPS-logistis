<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Affiches Instagram 4:5 — Freda Tech × Elite Auto Deal</title>
<link rel="stylesheet" href="../../v2/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
.poster{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Inter',sans-serif;color:#0B0B0C;background:#F7F7F8}
.abs{position:absolute}
.h{font-weight:800;letter-spacing:-.035em;line-height:1}
.blue{color:#C8102E}
.pill{display:flex;align-items:center;gap:16px;border-radius:999px;font-weight:700}
.tile{display:flex;align-items:center;justify-content:center;flex:none}
.ic{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.shadow{box-shadow:0 40px 80px rgba(20,20,24,.20),0 10px 24px rgba(20,20,24,.10)}
.dev{position:absolute;background:#0e1424}
.scr{position:relative;overflow:hidden;background:#fff}
.scr img{display:block}
.glare{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%)}
.aur{position:absolute;border-radius:50%}
.dots{position:absolute;inset:-40px;background-image:radial-gradient(rgba(11,11,12,.13) 2px,transparent 2.5px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000,transparent 75%)}
.blob{position:absolute;border-radius:50%;background:#C8102E}
.notif{display:flex;gap:16px;align-items:flex-start;border-radius:30px;padding:20px 22px;background:rgba(255,255,255,.96);box-shadow:0 24px 50px rgba(20,20,24,.25)}
.notif .ap{width:66px;height:66px;border-radius:18px;background:#0B0B0C;display:flex;align-items:center;justify-content:center;flex:none}
.foot{position:absolute;left:40px;top:1222px;width:1000px;height:92px;border-radius:46px;background:#fff;display:flex;align-items:center;padding:0 12px 0 14px;gap:14px}
.foot .ph{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800;color:#0B1B3F}
.foot .sub{margin-left:auto;font-size:20px;font-weight:600;color:#5B6479;text-align:right;line-height:1.3;padding-right:16px}
</style></head>
<body>
<!-- shared pieces are injected by the script below -->
<div class="poster" id="P"></div>
<script>
const IC={
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3 3.2 15 0 18M12 3c-3.2 3-3.2 15 0 18"/>',
 phone:'<rect x="6" y="2" width="12" height="20" rx="2.6"/><path d="M12 7v7M9 11l3 3 3-3M10.5 18.5h3"/>',
 server:'<rect x="3" y="3" width="18" height="7" rx="1.6"/><rect x="3" y="14" width="18" height="7" rx="1.6"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 plane:'<path d="M2.5 13.5l7-1.5 5-8.5h2.5l-2 8.5 5-.8 1.5-2.2h1.8l-1 3.5 1 3.5h-1.8L20 13.8l-5-.8 2 8.5h-2.5l-5-8.5-7-1.5z"/>',
 pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2.2"/><path d="M3.5 7l8.5 6 8.5-6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5"/>',
 call:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 ship:'<path d="M3 15h18l-2.5 5h-13zM6 15V9h12v6M9 9V5h6v4"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/>',
 bolt:'<path d="M13 2L4.5 13.5h6.5L10 22l8.5-11.5H12z"/>',
 car:'<path d="M3 15l1.6-4.6A2 2 0 0 1 6.5 9h11a2 2 0 0 1 1.9 1.4L21 15v3h-2.5M5.5 18H3v-3h18"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 mob:'<rect x="7" y="2" width="10" height="20" rx="2.2"/><path d="M11 18.5h2"/>',
 lock:'<rect x="4" y="10" width="16" height="11" rx="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14.5v3"/>',
 dollar:'<rect x="3" y="4" width="18" height="16" rx="2.2"/><path d="M7 9h10M7 13h6M15.5 15.5h2"/>'};
const svg=(k,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" class="ic">${IC[k]}</svg>`;
const tile=(k,c,s=64)=>`<div class="tile" style="width:${s}px;height:${s}px;border-radius:50%;background:${c}">${svg(k,s*.52)}</div>`;
const V2='../../v2/img/', E='../img/';
const p=+(new URLSearchParams(location.search).get('p')||1);
const dark=p===3;
let seed=5+p;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function bg(){let h='';
  if(dark) h+=`<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 30%,#2A2A2E 0%,#121214 50%,#0B0B0C 100%)"></div><div class="aur" style="left:-200px;top:300px;width:1100px;height:1100px;background:radial-gradient(closest-side,rgba(200,16,46,.30),transparent)"></div>`;
  else h+=`<div class="aur" style="left:-380px;top:-300px;width:1200px;height:1200px;background:radial-gradient(closest-side,rgba(200,16,46,.16),transparent)"></div>
   <div class="aur" style="left:420px;top:380px;width:1000px;height:1000px;background:radial-gradient(closest-side,rgba(205,207,214,.65),transparent)"></div>
   <div class="aur" style="left:-260px;top:800px;width:900px;height:900px;background:radial-gradient(closest-side,rgba(200,16,46,.10),transparent)"></div><div class="dots"></div>`;
  for(let i=0;i<12;i++){const s=20+rnd()*110;h+=`<div class="blob" style="left:${rnd()*1080-s/2}px;top:${rnd()*1350-s/2}px;width:${s}px;height:${s}px;opacity:${(dark?.08:.04)+rnd()*.07};${rnd()<.5?`filter:blur(${6+rnd()*8}px);`:''}${dark?'background:#fff':''}"></div>`}
  return h}
function header(tag){const sfx=dark?'-white':'';return `
  <div class="abs" style="left:44px;top:44px;display:flex;align-items:center;gap:14px">
    <img src="${V2}freda-mark${sfx}.png" style="width:62px"><div><img src="${V2}freda-word${sfx}.png" style="width:220px;display:block"><img src="${V2}freda-group${sfx}.png" style="width:93px;display:block;margin:5px 0 0 128px"></div></div>
  <div class="abs pill" style="right:44px;top:52px;height:56px;padding:0 22px;background:${dark?'rgba(255,255,255,.12)':'#fff'};font-size:20px;letter-spacing:.14em;color:${dark?'#fff':'#0B0B0C'}"><span style="width:11px;height:11px;border-radius:50%;background:#C8102E"></span>${tag}</div>`}
function footer(){return `<div class="foot shadow">
   ${tile('call','#C8102E',66)}<div class="ph">+1 (774) 458-5835</div>
   <div class="tile" style="width:66px;height:66px;border-radius:50%;margin-left:8px"><img src="${V2}whatsapp.png" style="width:66px"></div><div class="ph" style="font-size:24px;color:#1a9e4b">WhatsApp</div>
   <div class="sub"><b style="color:#0B1B3F">Freda Tech</b><br>filiale de Freda Pay LLC</div></div>`}
function headline(a,b,top=150,fs=92,col2=null){return `<div class="abs h" style="top:${top}px;width:1080px;text-align:center;font-size:${fs}px;${dark?'color:#fff':''}">${a}<br><span style="color:${col2||(dark?'#FF4D63':'#C8102E')}">${b}</span></div>`}
function laptop(x,y,w,img,pos=0){const sw=w-32, sh=Math.round(sw*900/1440);return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px">
  <div class="dev shadow" style="position:relative;width:${w}px;border-radius:22px 22px 6px 6px;padding:16px 16px 20px"><div class="scr" style="width:${sw}px;height:${sh}px;border-radius:6px"><img src="${img}" style="width:${sw}px;margin-top:${-pos}px"><div class="glare"></div></div></div>
  <div style="margin-left:-${w*.07}px;width:${w*1.14}px;height:26px;border-radius:0 0 26px 26px;background:linear-gradient(#dfe5f0,#a9b4c9);box-shadow:0 26px 50px rgba(20,20,24,.25)"></div></div>`}
function phone(x,y,w,img,r=0,pos=0){const sw=w-24, sh=Math.round(sw*844/390);return `<div class="abs" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)">
  <div class="dev shadow" style="position:relative;width:${w}px;border-radius:${w*.17}px;padding:12px"><div class="scr" style="width:${sw}px;height:${sh}px;border-radius:${w*.14}px"><img src="${img}" style="width:${sw}px;margin-top:${-pos}px"><div class="glare"></div>
  <div style="position:absolute;left:${sw/2-45}px;top:10px;width:90px;height:24px;border-radius:12px;background:#0e1424"></div></div></div></div>`}
const notif=(x,y,w,body,tag)=>`<div class="abs notif" style="left:${x}px;top:${y}px;width:${w}px"><div class="ap"><img src="${E}logo-blanc.svg" style="width:56px"></div><div style="flex:1"><div style="font-size:20px;font-weight:700;color:#5B6479;display:flex;justify-content:space-between"><span>Elite Auto Deal</span><span style="font-weight:700;color:#C8102E">${tag||''}</span></div><div style="font-size:24px;font-weight:600;line-height:1.25;margin-top:4px">${body}</div></div></div>`;

let H=bg();
if(p===1){
  H+=header('NOUVEAU PROJET');
  H+=headline('Nouveau projet','livré.',150,96);
  H+=`<div class="abs" style="top:352px;width:1080px;text-align:center;font-size:30px;font-weight:600;color:#5B5F66">Site web, espace client &amp; paiements pour <b style="color:#0B0B0C">Elite Auto Deal</b></div>`;
  H+=laptop(60,470,760,E+'d-home-full.png');
  H+=phone(770,520,265,E+'m-home-full.png',4);
  H+=`<div class="abs" style="left:150px;top:1000px;width:620px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent)"></div>`;
  H+=`<img class="abs" src="${E}cars/mercedes-gle-coupe.png" style="left:150px;top:810px;width:620px;filter:drop-shadow(0 30px 24px rgba(0,0,0,.30))">`;
  H+=`<div class="abs shadow" style="left:60px;top:1085px;width:300px;height:110px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center"><img src="${E}logo.svg" style="width:240px"></div>`;
  H+=`<div class="abs" style="left:380px;top:1085px;display:flex;flex-direction:column;gap:12px">
     <div class="pill shadow" style="height:56px;padding:0 22px 0 6px;background:#fff;font-size:22px">${tile('lock','#C8102E',44)}MonCash · Natcash · Carte · Virement</div>
     <div class="pill shadow" style="height:56px;padding:0 22px 0 6px;background:#fff;font-size:22px">${tile('folder','#0B0B0C',44)}Suivi de dossier &amp; espace client</div></div>`;
  H+=footer();
}
if(p===2){
  H+=header('ÉTUDE DE CAS');
  H+=headline('Paiement en ligne','sécurisé.',150,96);
  H+=phone(60,400,380,E+'m-retour2.png',-3);
  H+=notif(40,355,560,'Paiement confirmé par <b>Freda Pay Issuing</b>.','ÉTAPE 3/4');
  const TL=[['file','Devis reçu','EAD-DEV-0001 · 105 $','#0B0B0C',1],['mob','MonCash','13 860 HTG','#C8102E',1],['check','Paiement confirmé','Freda Pay Issuing','#25B66B',2],['folder','Dossier suivi','EAD-2026-35289','#D9DADF',0]];
  H+=`<div class="abs" style="left:552px;top:520px;width:8px;height:480px;border-radius:4px;background:#E5E7EB"></div><div class="abs" style="left:552px;top:520px;width:8px;height:320px;border-radius:4px;background:linear-gradient(#0B0B0C,#C8102E,#25B66B)"></div>`;
  TL.forEach((s,i)=>{H+=`<div class="abs" style="left:500px;top:${470+i*160}px;display:flex;align-items:center;gap:20px">
    <div style="position:relative;width:112px;height:112px">${s[4]===2?`<div style="position:absolute;inset:-14px;border-radius:50%;border:5px solid #25B66B;opacity:.35"></div>`:''}<div class="tile" style="position:absolute;inset:0;border-radius:50%;background:${s[3]};${s[4]?`box-shadow:0 14px 30px ${s[3]}55`:''}">${svg(s[0],54)}</div></div>
    <div><div style="font-size:32px;font-weight:800;letter-spacing:-.02em;${s[4]?'':'color:#9A9CA3'}">${s[1]}</div><div style="font-size:22px;font-weight:600;color:#5B5F66;margin-top:4px">${s[2]}</div></div></div>`});
  H+=`<div class="abs shadow" style="left:500px;top:1100px;width:540px;height:96px;border-radius:30px;background:#fff">
     <div class="abs" style="left:26px;top:18px;font-size:18px;font-weight:800;letter-spacing:.1em;color:#0B0B0C">DEVIS</div><div class="abs" style="right:26px;top:18px;font-size:18px;font-weight:800;letter-spacing:.1em;color:#C8102E">DOSSIER SUIVI</div>
     <div class="abs" style="left:26px;top:60px;width:488px;height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,#E5E7EB 0 12px,transparent 12px 20px)"></div>
     <div class="abs" style="left:26px;top:60px;width:330px;height:7px;border-radius:4px;background:linear-gradient(90deg,#0B0B0C,#C8102E)"></div>
     <div class="abs tile" style="left:330px;top:42px;width:44px;height:44px;border-radius:50%;background:#C8102E">${svg('car',26)}</div></div>`;
  H+=footer();
}
if(p===3){
  H+=header('FREDA TECH');
  H+=headline('Freda Tech crée','vos outils digitaux.',150,92);
  const SL=[['chat','Contact',6950,7517],['file','Précommande',4180,4760],['dollar','Services',2950,3560],['car','Notre flotte',1030,1720],['home','Accueil',0,1000]];
  let iso='';SL.forEach((l,i)=>{const w=540, h=Math.round((l[3]-l[2])*w/1440);
    const bgi=`url(${E}d-home-full.png) 0 ${-l[2]*w/1440}px/${w}px auto`;
    iso+=`<div class="abs" style="left:0;top:${(360-h)/2}px;width:${w}px;height:${h}px;transform-style:preserve-3d;transform:translateZ(${i*92}px)">
      <div class="abs" style="inset:0;border-radius:12px;background:#fff ${bgi} no-repeat;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 30px 60px rgba(0,0,0,.55)"></div>
      <div class="abs" style="left:0;top:100%;width:100%;height:14px;background:linear-gradient(#dcdde2,#a6a8b1);transform-origin:50% 0;transform:rotateX(-90deg)"></div>
      <div class="abs" style="left:100%;top:0;width:14px;height:100%;background:linear-gradient(90deg,#b9bbc3,#868892);transform-origin:0 50%;transform:rotateY(90deg)"></div></div>`});
  H+=`<div class="abs" style="left:380px;top:800px;width:0;height:0;perspective:2400px;perspective-origin:0 -200px">
       <div class="abs" style="left:-270px;top:-180px;width:540px;height:360px;transform-style:preserve-3d;transform:rotateX(56deg) rotateZ(-34deg)">${iso}</div></div>`;
  const lbl=[['home','Accueil','#C8102E',600],['car','Notre flotte','#0B0B0C',672],['dollar','Services &amp; tarifs','#C8102E',744],['file','Précommande &amp; essai','#0B0B0C',816],['chat','Contact &amp; WhatsApp','#25B66B',888]];
  lbl.forEach(l=>{H+=`<div class="abs pill shadow" style="left:690px;top:${l[3]}px;height:60px;padding:0 20px 0 6px;background:#fff;font-size:22px">${tile(l[0],l[2],48)}${l[1]}</div>`});
  const SV=[['globe','Sites web','#C8102E'],['phone','Apps mobiles','#0B0B0C'],['server','Systèmes informatiques','#5B5F66']];
  SV.forEach((v,i)=>{H+=`<div class="abs shadow" style="left:${40+i*340}px;top:1010px;width:320px;height:180px;border-radius:32px;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 26px;gap:14px">
     <div class="tile" style="width:72px;height:72px;border-radius:22px;background:${v[2]}">${svg(v[0],40)}</div><div style="font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1">${v[1]}</div></div>`});
  H+=footer();
}
document.getElementById('P').innerHTML=H;
</script>
</body></html>
