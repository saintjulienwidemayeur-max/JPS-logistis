      <div style="position:absolute;left:300px;top:700px;width:360px;height:24px;border-radius:12px;background:linear-gradient(#e2e8f2,#b4bfd3);box-shadow:0 20px 40px rgba(11,27,63,.2)"></div>

</div>

<script>
const W=1080,H=1920,DUR=20;
const CUT=[0,2.5,5,9,13,16.5,DUR];
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,d)=>cl((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=x=>1-Math.pow(1-x,3), eOut5=x=>1-Math.pow(1-x,5), eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eEl=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI/3))+1;
const $=id=>document.getElementById(id);
function T(el,o){ if(typeof el==='string') el=$(el);
  const {x=0,y=0,z=0,s=1,sx=s,sy=s,r=0,o:op=1,blur=0,ry=0,rx=0}=o;
  el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${sx},${sy})`;
  el.style.opacity=op; el.style.filter=blur>0.05?`blur(${blur}px)`:''; }
// place an element by its centre
function C(el,cx,cy,o={}){ if(typeof el==='string') el=$(el);
  const w=el.offsetWidth,h=el.offsetHeight; T(el,Object.assign({},o,{x:cx-w/2,y:cy-h/2})); }
function line(id,t,a,exit){ const i=eExpo(P(t,a,.75)), e=exit!=null?eIn(P(t,exit,.35)):0;
  $(id).style.transform=`translateY(${(1-i)*110-e*110}%) rotate(${(1-i)*4}deg)`; }
const S=(id,v)=>$(id).style.visibility=v?'visible':'hidden';

// ---------- icons ----------
const IC={
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3 3.2 15 0 18M12 3c-3.2 3-3.2 15 0 18"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5"/>',
 phone:'<rect x="6" y="2" width="12" height="20" rx="2.6"/><path d="M12 7v7M9 11l3 3 3-3M10.5 18.5h3"/>',
 lang:'<path d="M3 5h10M8 3v2M5 5c.8 3.5 3.5 6.3 7 7.5M11 5c-.8 3.5-3.5 6.3-7 7.5"/><path d="M13 21l4-9 4 9M14.5 18h5"/>',
 pal:'<path d="M12 3a9 9 0 1 0 0 18c1.4 0 1.9-1 1.4-2.1-.6-1.3.3-2.4 1.6-2.4H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/>',
 bolt:'<path d="M13 2L4.5 13.5h6.5L10 22l8.5-11.5H12z"/>',
 seo:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11.5l2 2 3.5-4"/>',
 mon:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
 tab:'<rect x="5" y="2" width="14" height="20" rx="2.2"/><path d="M11 18.5h2"/>',
 mob:'<rect x="7" y="2" width="10" height="20" rx="2.2"/><path d="M11 18.5h2"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2.2"/><path d="M3.5 7l8.5 6 8.5-6"/>',
 dash:'<rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/>',
 lock:'<rect x="4" y="10" width="16" height="11" rx="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14.5v3"/>',
 spark:'<path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/>'};
const svg=(k,s=56)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" class="ic">${IC[k]}</svg>`;

// ---------- build dynamic DOM ----------
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const blobs=[];(function(){const c=$('blobs');for(let i=0;i<16;i++){const d=document.createElement('div');d.className='abs';
  const s=24+rnd()*120;d.style.cssText=`width:${s}px;height:${s}px;border-radius:50%;background:#034BAA`;c.appendChild(d);
  blobs.push({d,s,x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*30,vy:-10-rnd()*40,a:.05+rnd()*.12,b:rnd()<.45?6+rnd()*10:0,ph:rnd()*6})}})();
const conv=[];(function(){const c=$('conv');for(let i=0;i<22;i++){const d=document.createElement('div');d.className='abs';
  const s=18+rnd()*46;d.style.cssText=`width:${s}px;height:${s}px;border-radius:50%;background:#034BAA`;c.appendChild(d);
  const a=rnd()*Math.PI*2,R=520+rnd()*500;conv.push({d,s,x:540+Math.cos(a)*R,y:720+Math.sin(a)*R,dl:rnd()*.35})}})();
const P2=[['globe','Site web','#034BAA'],['user','Espace client','#FF5500'],['phone','App mobile','#1E88E5'],['lang','FR · EN · ES','#25B66B']];
(function(){const c=$('pills2');P2.forEach((p,i)=>{const d=document.createElement('div');d.className='abs pill shadow center';d.id='p2'+i;
  d.style.cssText+=`;left:${i%2?555:85}px;top:${1015+Math.floor(i/2)*124}px;width:440px;height:104px;background:#fff;padding:0 16px;font-size:34px`;
  d.innerHTML=`<div class="tile" style="width:74px;height:74px;border-radius:50%;background:${p[2]}">${svg(p[0],40)}</div>${p[1]}`;c.appendChild(d)})})();
const CH3=[['pal','Design sur mesure','#6C4CF5'],['bolt','Rapide & sécurisé','#FF5500'],['seo','SEO optimisé','#25B66B']];
(function(){const c=$('chips3');CH3.forEach((p,i)=>{const d=document.createElement('div');d.className='abs pill shadow center';d.id='c3'+i;
  const w=[400,390,320][i],x=[60,480,380][i],y=[1420,1420,1546][i];
  d.style.cssText+=`;left:${[40,460,380][i]}px;top:${y}px;width:${w}px;height:96px;background:#fff;padding:0 14px;font-size:30px`;
  d.innerHTML=`<div class="tile" style="width:68px;height:68px;border-radius:50%;background:${p[2]}">${svg(p[0],36)}</div>${p[1]}`;c.appendChild(d)})})();
const CH4=[['mon','Ordinateur','#034BAA'],['tab','Tablette','#FF5500'],['mob','Mobile','#1E88E5']];
(function(){const c=$('chips4');CH4.forEach((p,i)=>{const d=document.createElement('div');d.className='abs pill shadow center';d.id='c4'+i;
  d.style.cssText+=`;left:${[50,390,710][i]}px;top:480px;width:${[320,300,280][i]}px;height:88px;background:#fff;padding:0 12px;font-size:29px`;
  d.innerHTML=`<div class="tile" style="width:64px;height:64px;border-radius:50%;background:${p[2]}">${svg(p[0],34)}</div>${p[1]}`;c.appendChild(d)})})();
const F=[['box','Suivi de colis','en temps réel','#FF5500'],['lock','Espace client','sécurisé','#034BAA'],['mail','E-mails','automatiques','#1E88E5'],
         ['dash','Tableau de bord','administrateur','#0D2B80'],['globe','Trilingue','FR · EN · ES','#25B66B'],['phone','Application','installable','#6C4CF5']];
(function(){const c=$('feat');F.forEach((f,i)=>{const d=document.createElement('div');d.className='abs shadow center';d.id='f'+i;
  d.style.cssText+=`;left:${i%2?555:70}px;top:${490+Math.floor(i/2)*262}px;width:455px;height:232px;border-radius:40px;background:#fff;padding:30px 32px;backface-visibility:hidden`;
  d.innerHTML=`<div class="tile" id="fi${i}" style="width:92px;height:92px;border-radius:28px;background:${f[3]};box-shadow:0 14px 30px ${f[3]}55">${svg(f[0],50)}</div>
   <div style="font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:22px">${f[1]}</div><div style="font-size:28px;font-weight:600;color:#5B6479;margin-top:4px">${f[2]}</div>`;
  c.appendChild(d)})})();
// marquee of real site sections (desktop screenshot crops)
const MQ=[0,1020,2040,2520,3050,3560,0,1020,2040,2520];
(function(){const c=$('marq');MQ.forEach((y,i)=>{const d=document.createElement('div');d.className='abs shadow';d.id='mq'+i;
  d.style.cssText+=`;left:0;top:20px;width:420px;height:262px;border-radius:26px;overflow:hidden;background:#fff url(img/desk-full.png) no-repeat;background-size:420px auto;background-position:0 ${-y*420/1440}px;border:6px solid #fff`;c.appendChild(d)})})();
const burst=[];(function(){const c=$('burst');for(let i=0;i<26;i++){const d=document.createElement('div');d.className='abs';const s=10+rnd()*40;
  d.style.cssText=`width:${s}px;height:${s}px;border-radius:50%;background:#fff`;c.appendChild(d);
  const a=rnd()*Math.PI*2;burst.push({d,s,a,R:300+rnd()*520,dl:rnd()*.2})}})();

// ================= MASTER RENDER =================
window.render=function(t){
  let cur=0;for(let i=0;i<6;i++)if(t>=CUT[i])cur=i;
  for(let i=0;i<6;i++)S('s'+(i+1),i===cur);

  // ambient
  T('au1',{x:-350+Math.sin(t*.35)*220,y:-250+Math.cos(t*.3)*200});
  T('au2',{x:300+Math.cos(t*.4)*240,y:700+Math.sin(t*.33)*260});
